[project]
name = "cumple"
dynamic = ["version"]
description = "Delivery QC for audio. Does this file comply with Netflix, Apple TV+, Max, EBU R128, ATSC A/85, a cinema trailer, Spotify? Plus an audio diff that says how two files differ."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Victor E. Diaz", email = "victor10days@gmail.com" }]
keywords = ["audio", "loudness", "bs1770", "ebu-r128", "true-peak", "delivery", "qc", "netflix", "post-production"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "soundfile>=0.12",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.5",
  "pyyaml>=6",
  "wavinfo>=4.0",
]

[project.optional-dependencies]
app = ["pywebview>=6.2.1"]
app-qt = ["pywebview[qt]>=6.2.1"]

[project.urls]
Homepage = "https://cumple-uxa7.onrender.com/"
Source = "https://github.com/victor10days/cumple"
Download = "https://github.com/victor10days/cumple/releases/latest"

[project.scripts]
cumple = "cumple.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pyloudnorm>=0.2",
  "ruff>=0.6",
  "fonttools[woff]>=4.50",
  "loudcheck>=0.3.2",
]
packaging = ["pyinstaller>=6.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cumple/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cumple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008", "UP042"]  # typer defaults are idiomatic; str-Enums stay for pydantic/JSON

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
