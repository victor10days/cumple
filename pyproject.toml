[project]
name = "cumple"
version = "0.1.0"
description = "Delivery QC for audio. Does this file comply with Netflix, Apple TV+, Max, EBU R128, ATSC A/85, a cinema trailer, Spotify? Plus an audio diff that says how two files differ."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Victor E. Diaz", email = "victor10days@gmail.com" }]
keywords = ["audio", "loudness", "bs1770", "ebu-r128", "true-peak", "delivery", "qc", "netflix", "post-production"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "soundfile>=0.12",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.5",
  "pyyaml>=6",
  "wavinfo>=4.0",
]

[project.scripts]
cumple = "cumple.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pyloudnorm>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cumple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
