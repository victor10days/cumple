name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Test
        # The 29 EBU conformance cases skip here: the EBU test set is free but not redistributed;
        # the conformance job below runs them when the repository holds a link to a copy.
        run: uv run pytest
      - name: Build
        if: runner.os == 'Linux'
        run: uv build

  conformance:
    # The 29 EBU Tech 3341 and 3342 cases. The set is free from tech.ebu.ch but its terms do
    # not allow redistribution and the download refuses non-interactive fetchers, so this job
    # reads the zip from a link kept in the repository secret EBU_TEST_SET_URL (a private copy
    # the maintainer controls). Without the secret the cases are reported as skipped, exactly
    # as they are in the test job above.
    name: EBU conformance
    runs-on: ubuntu-latest
    env:
      EBU_TEST_SET_URL: ${{ secrets.EBU_TEST_SET_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Fetch the EBU test set
        if: env.EBU_TEST_SET_URL != ''
        run: |
          mkdir -p ~/.cache/cumple
          curl -fsSL "$EBU_TEST_SET_URL" -o ~/.cache/cumple/ebu-loudness-test-setv05.zip \
            || { echo "::error::EBU_TEST_SET_URL did not answer with the zip; the 29 cases cannot run"; exit 1; }
          ls -la ~/.cache/cumple
      - name: Check and unpack the EBU test set
        if: env.EBU_TEST_SET_URL != ''
        run: |
          cd ~/.cache/cumple
          unzip -tq ebu-loudness-test-setv05.zip
          mkdir -p ebu-loudness-test-set
          unzip -oq ebu-loudness-test-setv05.zip -d ebu-loudness-test-set
          ls ebu-loudness-test-set | head -5
      - name: Run the 29 cases
        run: uv run pytest tests/test_ebu_conformance.py -q -rs
      - name: Regenerate the conformance report and compare its results with the committed one
        if: env.EBU_TEST_SET_URL != ''
        run: |
          uv run python scripts/conformance_report.py > /tmp/CONFORMANCE.md
          # Compare the pass marks and the summary lines, not the two-decimal values, which can
          # differ at a rounding boundary between this runner and the machine that wrote the report.
          diff <(grep -o '✓' docs/CONFORMANCE.md | wc -l) <(grep -o '✓' /tmp/CONFORMANCE.md | wc -l)
          diff <(grep '^\*\*' docs/CONFORMANCE.md) <(grep '^\*\*' /tmp/CONFORMANCE.md)

  deploy:
    # Render does not deploy this service on its own. It was connected by the repository's public
    # URL rather than through a GitHub account, so nothing tells Render a commit landed and every
    # deploy in its history was pressed by hand. The push is announced here instead, through a
    # deploy hook, which has the better shape anyway: a commit that fails lint, the suite on any
    # of the three operating systems, the build or the EBU cases never reaches the live page.
    # The hook URL is a credential and lives in the repository secret RENDER_DEPLOY_HOOK
    # (Render dashboard, the cumple static site, Settings, Deploy Hook). Without it this job
    # fails on purpose: a silent skip would look like a deploy that happened.
    needs: [test, conformance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Tell Render to deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK is not set on this repository, so the live page still serves the previous commit."
            exit 1
          fi
          # Only the status code is printed; the hook URL must never reach the log.
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$HOOK")
          echo "Render answered $code"
          [ "$code" = "200" ] || exit 1
