id: fox-commercial-2024
name: Fox Networks commercial material (2024)
family: broadcast
summary: Fox Network Operations Delivery Requirements and Technical Specifications, February 2024, Technical Specifications for Commercial Material. Each commercial segment averages -24 LKFS per ATSC A/85 across all channels except the LFE; instantaneous peaks never above -6 dBFS and average peaks never above -10 dBFS; 5.1 on channels 1 to 6 with DVS, SAP or mono on 7 and mono on 8; 16 or 24-bit PCM at 48 kHz; stereo and mono deliveries need prior authorization. Fox states no tolerance; the ±2 window is the tool's default from A/85.
loudness:
  policy: all
  rules:
    - method: integrated
      standard: bs1770-3
      target: -24.0
      tolerance: 2.0
      notes: "Fox states the target and no tolerance; ±2 is the tool's default, the A/85 window."
peaks:
  sample_peak_max: -6.0
format:
  sample_rates: [48000]
  bit_depths: [16, 24]
  layouts: ["5.1", "5.1+lt-rt"]
  channel_order: smpte
clauses:
  loudness.integrated: "The loudness shall be measured across all channels, except LFE (Low-Frequency Enhancement) in units of LKFS per ATSC RP/A85. Each commercial segment shall have an average loudness of -24LKFS. [...] If the material’s loudness measures higher or lower than our loudness specification, the material will be subject to rejection. SAP and DVS are subject to the above loudness and dynamic range requirements."
  peak.sample: "Instantaneous audio peaks shall not exceed -6dBFS."
  peak.average: "Average peak audio levels shall not exceed -10dBFS."
  format.sample_rate: "MXF files shall have 8 audio PCM 16 (16 bits @ 48 kHz PCM) or 8 audio PCM 24 (24 bits @ 48 kHz PCM) channels per SMPTE 382M-2007. Audio Layout shall be included in MXF wrapper or XML data."
  format.bit_depth: "MXF files shall have 8 audio PCM 16 (16 bits @ 48 kHz PCM) or 8 audio PCM 24 (24 bits @ 48 kHz PCM) channels per SMPTE 382M-2007."
  format.layout: "All files shall be delivered per SMPTE 296M- 2001 with 5.1 digital sound per ATSC RP A/85. Videotape, SD, DVS, SAP, Stereo and Mono deliveries require prior authorization. [...] 5.1 digital surround sound shall be in phase. Dolby E is not accepted. [...] Channel 1: Left, 2: Right, 3: Center, 4: LFE Low Frequency Enhancement, 5: Left surround, 6: Right surround, 7: DVS, SAP, Mono, 8: Mono, 9 to 12: (n/a or not used). Programming shall be created such that any down mix from 5.1 to stereo or mono represents the original mix."
clauses_verbatim: true
provenance:
  - title: "Network Operations Delivery Requirements and Technical Specifications, Technical Specifications for Commercial Material"
    publisher: Fox Networks
    version: "February 2024"
    published: "February 2024"
    url: https://www.fox.com/pdf/Network-Operations-Delivery-Requirements-and-Technical-Specifications-Final.pdf
    retrieved: 2026-09-06
    grade: READ
    notes: "Read from the PDF's text layer. The -6 dBFS figure is an instantaneous peak, applied as a sample peak; the -10 dBFS average peak is recorded as a clause and not measured. Fox delivers as MXF, which cumple does not read; check the PCM printmaster before wrapping."
  - title: "Loudness tolerance"
    publisher: cumple
    retrieved: 2026-09-06
    grade: TOOL_DEFAULT
    role: default
    notes: "Fox states -24 LKFS with no tolerance; ±2 is the A/85 window applied as the tool's default."
