id: disney-r128
name: Disney R128 (dubs and territories on R 128)
family: streaming
summary: Disney Media Tech Specs, Localized Audio v1.5 (2022-02-28), the "Disney R128" standard used when a mix that originated in ATSC A85 is dubbed, and for territories on EBU R 128. -23 LUFS ±0.5, true peak never above -3 dBTP, short-term loudness never above -15, loudness range at most 20 LU, 1 kHz tone at -18 dBFS, measured from first to last frame of action. Disney also states a dialogue range of ±7 LU, which cumple does not measure.
loudness:
  policy: all
  rules:
    - method: integrated
      standard: bs1770-4
      target: -23.0
      tolerance: 0.5
peaks:
  true_peak_max: -3.0
dynamics:
  lra_max: 20.0
  short_term_max: -15.0
clauses:
  loudness.integrated: "Disney R128 Standard. Program Target (Tolerance): -23 LUFS (± 0.5) LU. [...] All measurements are based on the BS-1770 standard. All measurements are from First Frame of Action (FFOA) to Last Frame of Action (LFOA)."
  peak.true: "Maximum True Peak: -3 dBTP*. [...] *Please note: dBTP, this is the maximum peak level permitted - there is no expectation that audio should always peak to this level. True Peak is measured on all configurations (2.0, 5.1, Atmos,etc)."
  dynamics.short_term_max: "Maximum Short-Term Loudness: -15 LU"
  dynamics.lra: "Maximum Loudness Range: 20 LUFS"
  dialogue.range: "Dialogue Range: ±7 LU"
  reference.tone: "1kHz Reference Tone: -18 dBFS"
clauses_verbatim: true
provenance:
  - title: "Disney Media Tech Specs: Localization, Audio, Localized Audio, Loudness Standards, Disney R128"
    publisher: The Walt Disney Company
    version: "v1.5"
    published: "2022-02-28"
    url: https://mediatechspecs.disney.com/localization/audio/localized-audio?tab=loudness-standards&spec=disney-r128
    retrieved: 2026-09-06
    grade: READ
    notes: "Read directly in a browser (the site is a JavaScript app). Disney measures from First Frame of Action to Last Frame of Action; cumple measures the whole delivered file, so trim leaders and tone before checking. The dialogue range clause is recorded but not measured. The page names no BS.1770 revision; cumple applies BS.1770-4 gating, which is what R 128 specifies."
