id: fox-program-2018
name: Fox Networks broadcast program material (2018)
family: broadcast
summary: Fox Technical Specifications for Broadcast Program Material, August 2018, the public Fox programme delivery document. Average loudness of -24 LKFS for the duration of the program per ATSC A/85 (2013), measured across all channels except the LFE; true peaks never above -2 dBFS; 5.1 per ITU-R BS.775-3 on channels 1 to 6 with DVS, SAP or mono on 7 and mono on 8; 16 or 24-bit PCM at 48 kHz; any downmix must represent the original mix; Dolby E refused. Fox states no tolerance; the ±2 window is the tool's default from A/85.
loudness:
  policy: all
  rules:
    - method: integrated
      standard: bs1770-3
      target: -24.0
      tolerance: 2.0
      notes: "Fox states the target and no tolerance; ±2 is the tool's default, the A/85 window. Fox cites A/85 (12 March 2013), which measures per BS.1770-3; the gated result equals BS.1770-4 for 5.1 and stereo."
peaks:
  true_peak_max: -2.0
format:
  sample_rates: [48000]
  bit_depths: [16, 24]
  layouts: ["5.1", "5.1+lt-rt"]
  channel_order: smpte
clauses:
  loudness.integrated: "The loudness shall be measured across all channels, except LFE (Low-Frequency Enhancement) in units of LKFS per ATSC RP/A85 (Doc. A/85 12 March 2013). The Program must have an average loudness of -24lkfs, measured for the duration of the program, although if the material’s loudness measures out of specification at any point, the material is subject to rejection. [...] If the material’s loudness measures higher or lower than our loudness specification, the material will be subject to rejection. SAP and DVS are subject to the above loudness and dynamic range requirements."
  peak.true: "Audio true peaks shall not exceed -2dBFS"
  format.sample_rate: "MXF files shall have 8 audio PCM 16 (16 bits @ 48 kHz PCM) or 8 audio PCM 24 (24 bits @ 48 kHz PCM) channels per SMPTE ST 377-4:2012. Dolby E is not accepted."
  format.bit_depth: "MXF files shall have 8 audio PCM 16 (16 bits @ 48 kHz PCM) or 8 audio PCM 24 (24 bits @ 48 kHz PCM) channels per SMPTE ST 377-4:2012."
  format.layout: "All material shall be delivered per SMPTE ST 296:2012 with 5.1 digital sound per ITU-R BS 775-3 (08/2012). [...] 5.1 digital surround shall be in phase. Channel 1: Left, 2: Right, 3: Center, 4: LFE Low Frequency Enhancement, 5: Left surround, 6: Right surround, 7: DVS, SAP or Mono, 8: Mono, 9 to 12: (n/a or not used). [...] Programming shall be created such that any down mix from 5.1 to stereo or mono represents the original mix. [...] Stereo, 2-channel and monophonic deliveries require prior authorization."
  reference.tone: "At the head of the material, a 30-second test signal of color bars per SMPTE RP 219:2002 and an audio test tone of 1kHz. at -20dBFS shall reflect the recorded material"
clauses_verbatim: true
provenance:
  - title: "Technical Specifications for Broadcast Program Material"
    publisher: Fox Networks
    version: "August 2018"
    published: "August 2018"
    url: https://assets.foxdcg.com/dpp-uploaded/images/articles/59bc1012fdcf74001fb5d07f/Broadcast_AUG_2018_TechnicalSpecs.pdf
    retrieved: 2026-09-06
    grade: READ
    notes: "Read from the PDF's text layer. The document dates from 2018 and cites A/85:2013; no newer public programme specification was found on 2026-09-06 (Fox's February 2024 document covers commercial material, see fox-commercial-2024). Fox delivers as MXF, which cumple does not read; check the PCM printmaster before wrapping. The 8-track layout with mono on 7 and 8 is accepted as 5.1+lt-rt when those tracks fold down from the bed."
  - title: "Loudness tolerance"
    publisher: cumple
    retrieved: 2026-09-06
    grade: TOOL_DEFAULT
    role: default
    notes: "Fox states -24 LKFS with no tolerance; ±2 is the A/85 window applied as the tool's default."
