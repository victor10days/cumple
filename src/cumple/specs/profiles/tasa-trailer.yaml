id: tasa-trailer
name: Cinema trailer (TASA)
family: cinema
summary: Trailer Audio Standards Association limit for theatrical trailers. 85 dB Leq(m) over the whole trailer, M-weighted, calibrated so -20 dBFS is 85 dBC per screen channel with surrounds 3 dB lower.
leqm:
  max_db: 85.0
  calibration_dbfs: -20.0
  calibration_spl_db: 85.0
  surround_offset_db: -3.0
format:
  sample_rates: [48000, 96000]
  bit_depths: [24]
  layouts: ["5.1", "7.1"]
  channel_order: smpte
clauses:
  leqm.level: "Trailers shall not exceed 85 dB Leq(m), measured over the full duration ±3 s with M-weighting, per-channel detectors summed, pass or fail to the nearest 1 dB. (paraphrase of the TASA Standard, annex dated 15 January 2015)"
  leqm.calibration: "Reference: -20 dBFS corresponds to 85 dBC SPL for each screen channel; surround channels are calibrated 3 dB lower and therefore contribute 3 dB less to the sum. (paraphrase of the TASA Standard §1.4)"
  leqm.weighting: "The M-weighting response is tabulated in the TASA Standard §1.4.2 with tolerances: 0 dB at 2 kHz, -5.6 dB at 1 kHz, +6.6 dB at 6.3 kHz, -35.5 dB at 31 Hz, -27.8 dB at 20 kHz. cumple designs its filter from that table and tests it against the same tolerances."
clauses_verbatim: false
provenance:
  - title: "TASA Standard for Trailer Loudness"
    publisher: Trailer Audio Standards Association
    published: "annex dated 15 January 2015"
    url: https://www.tasatrailers.org/TASAStandard.pdf
    retrieved: 2026-09-03
    grade: READ
  - title: "ISO 21727:2016 Cinematography: Method of measurement of perceived loudness of short duration motion-picture audio material"
    publisher: ISO
    version: "2016"
    url: https://www.iso.org/standard/69744.html
    retrieved: 2026-09-03
    grade: GATED
    role: supporting
    notes: "Paywalled. The measurement method used here follows the freely published TASA description."
