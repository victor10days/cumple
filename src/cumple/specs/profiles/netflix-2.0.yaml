id: netflix-2.0
name: Netflix stereo (2.0) printmaster
family: streaming
summary: Netflix branded near-field 2.0 original-language mix (Sound Mix Specifications & Best Practices, OC-1-6). Lo/Ro preferred, or Lt/Rt; -27 LKFS ±2 dialogue-gated per BS.1770-1 over the entire program; -2 dBTP; mono compatible; 48 kHz / 24-bit discrete LPCM .wav or .bwav. Netflix's QC partners flag loudness only after both the dialogue-gated and the full-program measurement fail their ±3 windows.
loudness:
  policy: any
  rules:
    - method: dialogue_gated
      standard: bs1770-1
      target: -27.0
      tolerance: 2.0
      when: speech_at_or_above_15pct
      notes: "Netflix measures with Dolby Dialogue Intelligence. cumple approximates that gate with an open speech detector and says so on every sheet. QC partners flag at ±3 LU to absorb meter differences; the delivery window is ±2."
    - method: integrated
      standard: bs1770-4
      target: -24.0
      tolerance: 2.0
      when: speech_below_15pct
      notes: "Netflix states the under-15 % dialogue switch for near field Atmos and 5.1 mixes in its Best Practices. cumple applies the same switch to 2.0, because a mix with no dialogue has no dialogue-gated value; that extension is the tool's choice."
    - method: integrated
      standard: bs1770-4
      target: -24.0
      tolerance: 3.0
      role: fallback
      notes: "Netflix's QC procedure: if the dialogue-gated analysis fails, measure full program per BS.1770-4; if that passes, do not flag. The QC windows are -27 ±3 and -24 ±3."
peaks:
  true_peak_max: -2.0
  true_peak_recommended: -2.3
dynamics:
  lra_guide_max: 18.0
format:
  sample_rates: [48000]
  bit_depths: [24]
  channel_counts: [2]
  layouts: [stereo, lt-rt]
  packaging: discrete
  containers: [wav, bwf, rf64]
stems:
  must_sum_to_printmaster: true
  residual_max_dbfs: -60.0
  me_must_have_no_speech: true
checks:
  mono_compatibility: true
clauses:
  loudness.dialogue_gated: "Provide a Lo/Ro or LT/RT mix with -27 LKFS (+/- 2 LU) dialogue loudness using ITU-R BS.1770-1 measured over entire program."
  loudness.integrated: "When near field Atmos or 5.1 mixes measure at less than 15% dialogue, program target measurement will be used instead (-24 LKFS +/- 2 LU - ITU BS 1770-3 or -4)."
  loudness.fallback: "If the dialogue-gated analysis FAILS, proceed with measuring the mix against the ITU-R BS. 1770-4 full program algorithm. [...] If the full program analysis PASSES, do NOT flag in the QC Request. If the full program analysis FAILS, flag the Loudness LKFS Out of Spec as an ISSUE and include both the measurements for 1770-1 and 1770-4 or 1770-2/1770-3."
  peak.true: "Do not exceed +18dBu (-2 dBFS) maximum level (true-peak) over reference of -20 dBFS, achieved by peak limiting and not lowering the mix level. [Best Practices:] Set a True Peak limiter at -2.3 dBFS for all audio deliverables."
  dynamics.lra: "The following loudness range (LRA) values will play best on the service: [...] 2.0 program LRA between 4 and 18 LU. Dialog LRA of 10 LU or less. [Best Practices, which the page says are not technical specifications]"
  mono.compat: "Lo/Ro or LT/RT mix to be mono compatible."
  format.sample_rate: "48kHz/24-bit for Original Language Mix or M&E Mix - applies to Stems & Mix Masters."
  format.bit_depth: "48kHz/24-bit for Original Language Mix or M&E Mix - applies to Stems & Mix Masters."
  format.channels: "Mono audio is acceptable if the program’s original source is mono and no stereo and/or 5.1 mix exists. Mono audio must be duplicated on channels 1 & 2 and delivered as 2-channel."
  format.layout: "Provide a Lo/Ro or LT/RT mix [...] Lo/Ro mix is preferred."
  format.container: "Lossy or lossless audio compression is never allowed. Audio must be standard or RF64 discrete LPCM .wav or .bwav files."
  format.packaging: "Discrete audio is required, except in the following circumstances: When muxed audio is inherent to the source, such as audio in an IMF, Quicktime or Atmos® BWAV ADM container. Interleaved Secondary Audio .wav deliveries."
  stems.sum: "For Original Version: Provide 5.1 Dialog, Music and Effects stems that equal the 5.1 mix when combined."
  stems.me_speech: "Provide a fully filled 5.1 surround submix containing only Music & Effects (no dialog)."
clauses_verbatim: true
provenance:
  - title: "Netflix Sound Mix Specifications & Best Practices"
    publisher: Netflix
    version: "OC-1-6"
    published: "2024-10-29"
    url: https://studiopartner.netflix.net/studio/branded-sound-mix-spec-and-best-practices
    retrieved: 2026-09-04
    grade: READ
    notes: "Read directly in a browser; the page is a JavaScript app that renders nothing for command-line fetchers. The LRA values and the under-15 % dialogue rule sit in its Best Practices section, which the page says are not technical specifications."
  - title: "Loudness and True Peaks: How to Measure and When to Flag"
    publisher: Netflix
    published: "2024-04-30"
    url: https://studiopartner.netflix.net/studio/loudness-and-true-peaks-how-to-measure-and-when-to-flag
    retrieved: 2026-09-04
    grade: READ
    role: supporting
    notes: "QC-partner thresholds: -27 ±3 dialogue-gated (BS.1770-1), -24 ±3 full program (BS.1770-4), the fallback procedure, and the channel configuration (2.0 - Lt/Rt). Its true-peak flag threshold is -1 dBTP; the delivery specification stays at -2 dBTP."
  - title: "Speech switch on 2.0 and stem residual default"
    publisher: cumple
    retrieved: 2026-09-04
    grade: TOOL_DEFAULT
    role: default
    notes: "Netflix states the under-15 % dialogue switch for Atmos and 5.1 mixes; applying it to 2.0 is the tool's extension. Netflix publishes no null-test tolerance; -60 dBFS residual after alignment is the tool's choice."
